---
layout: default
---
<article class="entry">
  <header class="entry-head">
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
  </header>

  {{ content }}

  <nav class="pager" aria-label="More posts">
    {%- if page.previous %}
    <a class="prev" href="{{ page.previous.url | relative_url }}">
      <span>Previous</span>{{ page.previous.title }}</a>
    {%- endif %}
    {%- if page.next %}
    <a class="next" href="{{ page.next.url | relative_url }}">
      <span>Next</span>{{ page.next.title }}</a>
    {%- endif %}
  </nav>
</article>
