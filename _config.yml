title: White Coat Dreamin
tagline: "Teen in Scrubs: Chasing the Dream of Becoming a Doctor"
description: >-
  Monica's road to medicine — clinical programs, volunteering, founding a junior
  guild for Seattle Children's, and now Health and Human Sciences at LMU with
  early acceptance to medical school.
author: Monica Gupta
lang: en

# Served at the apex domain via the CNAME file; GitHub Pages resolves it with
# A records. The aitrekker.github.io/whitecoatdreamin preview URL no longer works.
url: "https://whitecoatdreamin.com"
baseurl: ""

permalink: /:year/:month/:day/:title/
excerpt_separator: "<!--more-->"
timezone: America/Los_Angeles

paginate: 10
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }

exclude:
  - _image_map.json
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
